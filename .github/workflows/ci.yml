name: Go CI

# 触发条件
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 默认权限
permissions:
  contents: read

jobs:
  ################################
  # 1. Go Build
  ################################
  build:
    name: Build Go Application
    runs-on: ubuntu-latest
    steps:
    # 拉取代码
    - name: Checkout
      uses: actions/checkout@v4

    # 安装Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Download Dependencies
      run:
        go mod download

    # 编译
    - name: Build
      run:
        go build -v .


  ################################
  # 2. Unit Test
  ################################
  test:
    name: Go Unit Test
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Test
        run:
          go test -v ./...


  ################################
  # 3. CodeQL SAST
  ################################
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  ################################
  # 4. Secret Scan
  ################################
  gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ################################
  # 5. Dependency Scan
  ################################
  trivy-fs:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  ################################
  # 6. Docker Build
  ################################
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Docker Build
        run:
          docker build \
          -t demo-cicd:latest .
      - name: Save Docker Image
        run:
          docker save demo-cicd:latest \
          -o demo-cicd.tar

  ################################
  # 7. Docker Image Security Scan
  ################################
  trivy-image:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Image
        run:
          docker build \
          -t demo-cicd:latest .
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: demo-cicd:latest
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true