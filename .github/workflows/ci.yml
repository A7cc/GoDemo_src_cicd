name: Go CI

on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 拉取代码
    - name: Checkout
      uses: actions/checkout@v4

    # 安装Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 编译
    - name: Build
      run:
        go build -v .

    # 测试
    - name: Test
      run:
        go test -v ./...

    # Docker构建
    - name: Docker Build
      run:
        docker build -t demo-cicd .
