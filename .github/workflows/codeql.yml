name: "CodeQL"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven
    - name: Build
      run:
        mvn clean package
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-extended
    - name: Build
      run:
        mvn clean package
    - name: Analyze
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"